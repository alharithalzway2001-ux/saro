<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسف سارتي 🥺</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
           /* القمر المضيء */
body::before {
    content: '';
    position: absolute;
    top: 40px;
    right: 70px;
    width: 90px;
    height: 90px;
    background: #fffdf0;
    border-radius: 50%;
    box-shadow: 0 0 40px #fffdf0, 0 0 90px rgba(255, 253, 240, 0.5);
    z-index: 1;
}

/* الغيوم البارزة والمتحركة */
body::after {
    content: '';
    position: absolute;
    top: 80px;
    left: -100px;
    width: 220px;
    height: 70px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 100px;
    box-shadow: 
        120px 40px 0 10px rgba(255, 255, 255, 0.08),
        300px -20px 0 20px rgba(255, 255, 255, 0.1),
        550px 60px 0 15px rgba(255, 255, 255, 0.07),
        800px 10px 0 25px rgba(255, 255, 255, 0.11);
    filter: blur(8px);
    animation: moveClouds 25s linear infinite alternate;
    pointer-events: none;
    z-index: 2;
}

@keyframes moveClouds {
    0% { transform: translateX(0); }
    100% { transform: translateX(350px); }

        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="card" id="apology-card">
        
        <div id="apology-screen">
            <div class="img-container">
                <img src="start.gif" alt="بداية" id="apology-img" class="card-img">
            </div>
            
            <h1 class="title">سارتي.. أنا آسف 🥺❤️</h1>
            <p class="message">حقك عليّا ارجوووك سامحيني</p>

            <div class="buttons">
                <button id="forgive-btn" class="btn yes">مسامحتك ❤️</button>
                <button id="no-btn" class="btn no">مزالت زعلانة 💔</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <div class="img-container">
                <img src="success.gif" alt="فرحة" class="card-img">
            </div>
            <h1 class="title">أحلى سارو في الدنيا! ✨</h1>
            <p class="message">شكراً لأنك ديما ف حياتي دائمًا 🎆💖</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
