<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسف سارة 🥺</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="card" id="apology-card">
        
        <div id="apology-screen">
            <div class="img-container">
                <img src="apology.gif" alt="آسف" id="apology-img" class="card-img" onerror="this.src='https://media.tenor.com/v1gVeeYbU4AAAAi/tonton-friends-sad.gif'">
            </div>
            
            <h1 class="title">سارة.. أنا آسف 🥺❤️</h1>
            <p class="message">حقك عليّ وما عاش اللي يزعلك، سامحتيني؟</p>

            <div class="buttons">
                <button id="forgive-btn" class="btn yes">مسامحتك ❤️</button>
                <button id="no-btn" class="btn no">مزالت زعلانة 💔</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <div class="img-container">
                <img src="happy.gif" alt="فرحة" class="card-img" onerror="this.src='https://media.tenor.com/vHqgU9E6mzoAAAAj/tonton-friends-chubby.gif'">
            </div>
            <h1 class="title">أحلى سارة في الدنيا! ✨</h1>
            <p class="message">شكراً لأن قلبك أبيض دائمًا 🎆💖</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
