<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسف سارة 🥺</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        /* خلفية سماء الليل الداكنة */
        body {
            background: linear-gradient(to bottom, #05050a, #0a0d1a, #101528) !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* القمر المضيء */
        body::before {
            content: '';
            position: absolute;
            top: 40px;
            right: 60px;
            width: 85px;
            height: 85px;
            background: #fffdf0;
            border-radius: 50%;
            box-shadow: 0 0 35px #fffdf0, 0 0 80px rgba(255, 253, 240, 0.3);
            z-index: 1;
        }

        /* الغيوم المتحركة */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, rgba(255, 255, 255, 0.09) 0%, transparent 40%);
            animation: moveClouds 45s linear infinite alternate;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-25%); }
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* بطاقة الاعتذار الداكنة الشفافة */
        .card {
            background: rgba(18, 22, 36, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 10;
            position: relative;
            backdrop-filter: blur(12px);
        }

        .img-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .title {
            color: #ff6b81;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .message {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
            position: relative;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .yes {
            background-color: #2a9d8f;
            color: #ffffff;
            z-index: 5;
        }

        .yes:hover {
            background-color: #238579;
            transform: scale(1.05);
        }

        .no {
            background-color: #e76f51;
            color: #ffffff;
            z-index: 10;
        }

        .hidden {
            display: none;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="card" id="apology-card">
        
        <div id="apology-screen">
            <div class="img-container">
                <img src="start.gif" alt="بداية" id="apology-img" class="card-img">
            </div>
            
            <h1 class="title">سارة.. أنا آسف 🥺❤️</h1>
            <p class="message">حقك عليّ وما عاش اللي يزعلك، سامحتيني؟</p>

            <div class="buttons">
                <button id="forgive-btn" class="btn yes">مسامحتك ❤️</button>
                <button id="no-btn" class="btn no">مزالت زعلانة 💔</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <div class="img-container">
                <img src="success.gif" alt="فرحة" class="card-img">
            </div>
            <h1 class="title">أحلى سارة في الدنيا! ✨</h1>
            <p class="message">شكراً لأن قلبك أبيض دائمًا 🎆💖</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
