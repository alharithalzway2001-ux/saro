<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسف سارتي 🥺</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="card" id="apology-card">
        
        <div id="apology-screen">
            <div class="img-container">
                <img src="start.gif" alt="بداية" id="apology-img" class="card-img">
            </div>
            
            <h1 class="title">سارتي.. أنا آسف 🥺❤️</h1>
            <p class="message">حقك علياا اروجووك سامحيني</p>

            <div class="buttons">
                <button id="forgive-btn" class="btn yes">مسامحتك ❤️</button>
                <button id="no-btn" class="btn no">مزالت زعلانة 💔</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <div class="img-container">
                <img src="success.gif" alt="فرحة" class="card-img">
            </div>
            <h1 class="title">أحلى سارتي في الدنيا! ✨</h1>
            <p class="message">احلي سارو في الدنيا 🎆💖</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
